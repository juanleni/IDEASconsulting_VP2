name: Tests

# Fase 1 (2026-08-10): gate minimo antes de cualquier deploy manual a Render (autoDeploy
# esta en false a proposito, ver render.yaml). Este workflow no despliega nada -- solo corre
# la suite de tests existente (nicegui_v2/tests/) en cada push/PR a main, para que un error
# se vea en GitHub antes de hacer "Deploy latest commit" a mano en el dashboard de Render.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Correr suite de tests (nicegui_v2/tests)
        working-directory: nicegui_v2
        run: python -m pytest tests/ -v
